<section class="measurements-page">
  <form class="measurements-card" [formGroup]="form" (ngSubmit)="onSave()">
    <header class="measurements-card__header">
      <h1 class="measurements-card__title">MEASUREMENTS</h1>
      @if (showEditLink) {
        <button type="button" class="measurements-card__edit" (click)="onEdit()">Edit</button>
      }
    </header>

    @if (successMessage()) {
      <p class="measurements-message measurements-message--success" role="status">
        {{ successMessage() }}
      </p>
    }

    @if (errorMessage()) {
      <p class="measurements-message measurements-message--error" role="alert">
        {{ errorMessage() }}
      </p>
    }

    <div class="measurements-card__body">
      <div class="measurements-card__fields">
        <label class="measurements-field">
          <span class="measurements-field__label">PD</span>
          <input
            class="measurements-field__input"
            [class.measurements-field__input--invalid]="
              form.controls.pd.invalid && form.controls.pd.touched
            "
            type="number"
            step="0.1"
            inputmode="decimal"
            formControlName="pd"
          />
        </label>

        <label class="measurements-field">
          <span class="measurements-field__label">Near PD</span>
          <input
            class="measurements-field__input"
            [class.measurements-field__input--invalid]="
              form.controls.nearPd.invalid && form.controls.nearPd.touched
            "
            type="number"
            step="0.1"
            inputmode="decimal"
            formControlName="nearPd"
          />
        </label>

        <label class="measurements-field">
          <span class="measurements-field__label">Frame Width</span>
          <input
            class="measurements-field__input"
            [class.measurements-field__input--invalid]="
              form.controls.frameWidth.invalid && form.controls.frameWidth.touched
            "
            type="number"
            step="1"
            inputmode="numeric"
            formControlName="frameWidth"
          />
        </label>

        <label class="measurements-field">
          <span class="measurements-field__label">Bridge Width</span>
          <input
            class="measurements-field__input"
            [class.measurements-field__input--invalid]="
              form.controls.bridgeWidth.invalid && form.controls.bridgeWidth.touched
            "
            type="number"
            step="1"
            inputmode="numeric"
            formControlName="bridgeWidth"
          />
        </label>

        <label class="measurements-field">
          <span class="measurements-field__label">Temple Length</span>
          <input
            class="measurements-field__input"
            [class.measurements-field__input--invalid]="
              form.controls.templeLength.invalid && form.controls.templeLength.touched
            "
            type="number"
            step="1"
            inputmode="numeric"
            formControlName="templeLength"
          />
        </label>

        <label class="measurements-field">
          <span class="measurements-field__label">Lens Height</span>
          <input
            class="measurements-field__input"
            [class.measurements-field__input--invalid]="
              form.controls.lensHeight.invalid && form.controls.lensHeight.touched
            "
            type="number"
            step="1"
            inputmode="numeric"
            formControlName="lensHeight"
          />
        </label>

        <label class="measurements-field">
          <span class="measurements-field__label">Wrap Angle</span>
          <div class="measurements-field__wrap">
            <input
              class="measurements-field__input"
              [class.measurements-field__input--invalid]="
                form.controls.wrapAngle.invalid && form.controls.wrapAngle.touched
              "
              type="number"
              step="1"
              inputmode="numeric"
              formControlName="wrapAngle"
            />
            <span class="measurements-field__suffix">°</span>
          </div>
        </label>

        <label class="measurements-field">
          <span class="measurements-field__label">Face Form</span>
          <select class="measurements-field__input measurements-field__select" formControlName="faceForm">
            @for (option of faceFormOptions; track option) {
              <option [value]="option">{{ option }}</option>
            }
          </select>
        </label>

        <label class="measurements-field">
          <span class="measurements-field__label">Frame Height</span>
          <input
            class="measurements-field__input"
            [class.measurements-field__input--invalid]="
              form.controls.frameHeight.invalid && form.controls.frameHeight.touched
            "
            type="number"
            step="1"
            inputmode="numeric"
            formControlName="frameHeight"
          />
        </label>
      </div>

      <app-face-measurement-diagram
        [pd]="diagramPd()"
        [frameWidth]="diagramFrameWidth()"
        [lensHeight]="diagramLensHeight()"
      />
    </div>

    @if (isEditing()) {
      <button type="submit" class="measurements-actions__save" [disabled]="isSaving()">
        {{ isSaving() ? 'Saving…' : 'Save Measurements' }}
      </button>
    }
  </form>
</section>
