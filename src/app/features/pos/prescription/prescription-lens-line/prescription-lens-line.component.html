<article class="lens-line" [formGroup]="group()">
  <header class="lens-line__header">
    <h3 class="lens-line__title">Lens {{ index() + 1 }}</h3>
    <!-- <button type="button" class="lens-line__remove" aria-label="Remove lens line" (click)="remove.emit()">
      Remove
    </button> -->

    <button type="button" class="frame-line__remove" aria-label="Remove frame" (click)="remove.emit()">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path
          d="M9 3h6l1 2h4v2H4V5h4l1-2zm1 6h2v8h-2V9zm4 0h2v8h-2V9zM7 9h2v8H7V9zm1 12h8a2 2 0 0 0 2-2V7H6v12a2 2 0 0 0 2 2z"
          fill="currentColor">
        </path>
      </svg>
    </button>

  </header>

  <div class="lens-line__grid">
    <label class="prescription-field">
      <span class="prescription-field__label">Category</span>
      <select class="prescription-field__input prescription-field__select" formControlName="category">
        @for (category of categories; track category.id) {
        <option [value]="category.value">{{ category.value }}</option>
        }
      </select>
    </label>

    <label class="prescription-field lens-line__field--wide">
      <span class="prescription-field__label">Order Lens</span>
      <input class="prescription-field__input" type="text" formControlName="orderLens"
        placeholder="e.g. CR39, 1.67 grey" />
    </label>

    <label class="prescription-field">
      <span class="prescription-field__label">Price</span>
      <input class="prescription-field__input" type="number" min="0" step="0.01" inputmode="decimal"
        formControlName="price" />
    </label>

    <label class="prescription-field">
      <span class="prescription-field__label">Quantity</span>
      <input class="prescription-field__input" type="number" min="1" step="1" inputmode="numeric"
        formControlName="quantity" />
    </label>

    <div class="lens-line__total">
      <span>Total</span>
      <strong>{{ formatMoney(lineTotalFor(group())) }}</strong>
    </div>
  </div>
</article>
