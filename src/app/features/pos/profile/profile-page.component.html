<div class="profile-page">
  <header class="profile-page__top-bar">
    <button type="button" class="profile-page__back" aria-label="Back" (click)="goBack()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 6l-6 6 6 6" />
      </svg>
      Back
    </button>
    <h1 class="profile-page__title">Account & Store Info</h1>
  </header>

  <div class="profile-page__container">
    <section class="profile-page__card" aria-label="Store and account details">
      <div class="profile-page__avatar">{{ userInitials() }}</div>
      <h2 class="profile-page__name">{{ displayName() }}</h2>
      <p class="profile-page__branch">{{ branchName() }}</p>

      <button type="button" class="profile-page__sign-out" (click)="logout()">Logout</button>
    </section>
  </div>
</div>
