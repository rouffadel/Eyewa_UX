<section class="pos-card catalog-card" [class.catalog-card--locked]="locked()">
  <div class="catalog-card__header">
    <div class="catalog-card__tabs" role="tablist">
      @for (tab of tabs; track tab.key) {
        <button
          type="button"
          role="tab"
          class="catalog-card__tab"
          [class.catalog-card__tab--active]="category() === tab.key"
          [attr.aria-selected]="category() === tab.key"
          (click)="categoryChange.emit(tab.key)"
        >
          {{ tab.label }}
        </button>
      }
    </div>
  </div>

  <div class="catalog-card__body">
    <div class="catalog-card__grid-wrap">
      <div class="catalog-card__grid">
        @for (product of products(); track product.sku) {
          <button type="button" class="catalog-card__product" [disabled]="locked()" (click)="productSelect.emit(product)">
            <span class="catalog-card__product-image" aria-hidden="true">
              @if (product.photoPath) {
                <img [src]="product.photoPath" alt="" class="catalog-card__product-img" />
              } @else {
                <svg viewBox="0 0 64 32">
                  <ellipse cx="18" cy="16" rx="14" ry="10" fill="none" stroke="currentColor" stroke-width="2" />
                  <ellipse cx="46" cy="16" rx="14" ry="10" fill="none" stroke="currentColor" stroke-width="2" />
                  <path d="M32 16h0" stroke="currentColor" stroke-width="2" />
                </svg>
              }
            </span>
            <span class="catalog-card__product-name">{{ product.name }}</span>
            <span class="catalog-card__product-sku">{{ product.sku }}</span>
            <span class="catalog-card__product-price">{{ product.price.toFixed(2) }} SAR</span>
          </button>
        } @empty {
          <p class="catalog-card__empty">No products loaded. Search or scan to add items when catalog is connected.</p>
        }
      </div>
    </div>

    <div class="catalog-card__dots" aria-hidden="true">
      <span class="catalog-card__dot catalog-card__dot--active"></span>
      <span class="catalog-card__dot"></span>
      <span class="catalog-card__dot"></span>
    </div>
  </div>
</section>
