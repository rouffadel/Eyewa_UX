<section class="pos-card customer-card">
  @if (customer(); as c) {
    <div class="customer-card__header">
      <button type="button" class="customer-card__header-main" (click)="openDetail.emit()">
        <span class="customer-card__avatar">{{ c.initials }}</span>
        <span class="customer-card__identity">
          <span class="customer-card__name">{{ c.displayName }}</span>
          <span class="customer-card__id">{{ c.invoiceNo ?? c.id }}</span>
        </span>
        <svg class="customer-card__chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>
      <button
        type="button"
        class="customer-card__refresh"
        [disabled]="refreshing()"
        [attr.aria-label]="refreshing() ? 'Refreshing customer' : 'Refresh customer'"
        [attr.aria-busy]="refreshing()"
        (click)="onRefreshClick($event)"
      >
        <svg
          class="customer-card__refresh-icon"
          [class.customer-card__refresh-icon--spin]="refreshing()"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" />
        </svg>
      </button>
    </div>

    <div class="customer-card__body">
      <div class="customer-card__phone">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.45-1.14a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z" />
        </svg>
        {{ c.phoneMasked }}
      </div>

      @if (showLoyaltySection) {
        <div class="customer-card__loyalty">
          <div>
            <span class="customer-card__loyalty-label">Loyalty Balance</span>
            <span class="customer-card__loyalty-value">{{ c.loyaltyPoints }} PTS</span>
          </div>
          <button type="button" class="customer-card__redeem" (click)="redeemPoints.emit()">
            Redeem Points
          </button>
        </div>
      }

      <div class="customer-card__visit">
        <span class="customer-card__visit-label">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          Last Visit
        </span>
        <span class="customer-card__visit-date">{{ c.lastVisit }}</span>
      </div>
    </div>
  } @else {
    <div class="customer-card__empty">
      <p>Search or select a customer</p>
      <span>Use the header search to find a customer by name, mobile, or ID.</span>
    </div>
  }
</section>
