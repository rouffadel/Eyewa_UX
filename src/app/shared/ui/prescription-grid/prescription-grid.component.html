<section class="prescription-grid" [formGroup]="group()">
  <h3 class="prescription-grid__title">{{ title() }}</h3>

  <div class="prescription-grid__fields">
    @for (field of fields; track field) {
      <label class="prescription-grid__field">
        <span class="prescription-grid__label">{{ labelFor(field) }}</span>
        <div class="custom-select" [class.custom-select--open]="openField() === field">
          <button type="button" class="custom-select__trigger" 
                  [class.custom-select__trigger--invalid]="group().get(field)?.invalid && group().get(field)?.touched"
                  (click)="toggleDropdown(field, $event)">
            <span>{{ currentLabel(field) }}</span>
            <svg class="custom-select__arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m6 8 4 4 4-4" />
            </svg>
          </button>
          @if (openField() === field) {
            <div class="custom-select__options">
              <button type="button" class="custom-select__option" 
                      [class.custom-select__option--selected]="isSelected(field, null)"
                      (click)="selectOption(field, null)">
                Select
              </button>
              @for (option of optionsFor(field); track option.value) {
                <button type="button" class="custom-select__option" 
                        [class.custom-select__option--selected]="isSelected(field, option.value)"
                        (click)="selectOption(field, option.value)">
                  {{ option.label }}
                </button>
              }
            </div>
          }
        </div>
      </label>
    }
  </div>
</section>
