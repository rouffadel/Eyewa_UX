<nav class="bottom-nav" aria-label="POS sections">
  @for (item of items(); track item.tab) {
    <button
      type="button"
      class="bottom-nav__item"
      [class.bottom-nav__item--active]="isActive(item.tab)"
      [attr.aria-current]="isActive(item.tab) ? 'page' : null"
      [attr.aria-label]="item.ariaLabel"
      (click)="onTabClick(item.tab)"
    >
      <span class="bottom-nav__icon" aria-hidden="true">
        @if (item.badge) {
          <span class="bottom-nav__badge">{{ item.badge }}</span>
        }
        @switch (item.tab) {
          @case ('sell') {
            <svg viewBox="0 0 24 24">
              <path d="M7 7h14l-1.5 9h-11L7 7Z" />
              <path d="M7 7 6 3H3" />
              <circle cx="10" cy="19" r="1.5" />
              <circle cx="17" cy="19" r="1.5" />
            </svg>
          }
          @case ('prescription') {
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <path d="M8 12h8M12 8v8" />
            </svg>
          }
          @case ('reports') {
            <svg viewBox="0 0 24 24">
              <path d="M4 4h16v4H4z" />
              <path d="M4 10h10v4H4z" />
              <path d="M4 16h16v4H4z" />
            </svg>
          }
          @case ('insurance') {
            <svg viewBox="0 0 24 24">
              <path d="M12 3 4 6v6c0 5 3.5 8.5 8 9.5 4.5-1 8-4.5 8-9.5V6l-8-3Z" />
              <path d="M9.5 12.5 11 14l3.5-3.5" />
            </svg>
          }
          @case ('deliveries') {
            <svg viewBox="0 0 24 24">
              <path d="M4 4h10v16H4zm10 4h6l4 4v8h-10zM14 12h6" />
              <circle cx="8" cy="20" r="2" />
              <circle cx="18" cy="20" r="2" />
            </svg>
          }
          @case ('status') {
            <svg viewBox="0 0 24 24">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          }
        }
      </span>
      <span class="bottom-nav__indicator" aria-hidden="true"></span>
      <span class="bottom-nav__label bottom-nav__label--full">{{ item.label }}</span>
      @if (item.shortLabel) {
        <span class="bottom-nav__label bottom-nav__label--short" aria-hidden="true">{{
          item.shortLabel
        }}</span>
      }
    </button>
  }
</nav>
