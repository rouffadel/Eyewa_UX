<nav class="bottom-nav" aria-label="POS sections">
  @for (item of items; track item.tab) {
    <button
      type="button"
      class="bottom-nav__item"
      [class.bottom-nav__item--active]="isActive(item.tab)"
      [attr.aria-current]="isActive(item.tab) ? 'page' : null"
      [attr.aria-label]="item.ariaLabel"
      (click)="onTabClick(item.tab)"
    >
      <span class="bottom-nav__icon" aria-hidden="true">
        @switch (item.tab) {
          @case ('sell') {
            <svg viewBox="0 0 24 24">
              <path d="M7 7h14l-1.5 9h-11L7 7Z" />
              <path d="M7 7 6 3H3" />
              <circle cx="10" cy="19" r="1.5" />
              <circle cx="17" cy="19" r="1.5" />
            </svg>
          }
          @case ('prescription') {
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <path d="M8 12h8M12 8v8" />
            </svg>
          }
          @case ('measurements') {
            <svg viewBox="0 0 24 24">
              <path d="M4 8h16v8H4z" />
              <path d="M8 8v8M12 8v5M16 8v3" />
            </svg>
          }
          @case ('delivery') {
            <svg viewBox="0 0 24 24">
              <path d="M3 7h11v8H3z" />
              <path d="M14 10h4l2 3v2h-6v-5Z" />
              <circle cx="7" cy="17" r="1.5" />
              <circle cx="17" cy="17" r="1.5" />
            </svg>
          }
          @case ('more') {
            <svg viewBox="0 0 24 24">
              <circle cx="6" cy="12" r="1.5" />
              <circle cx="12" cy="12" r="1.5" />
              <circle cx="18" cy="12" r="1.5" />
            </svg>
          }
        }
      </span>
      <span class="bottom-nav__indicator" aria-hidden="true"></span>
      <span class="bottom-nav__label bottom-nav__label--full">{{ item.label }}</span>
      @if (item.shortLabel) {
        <span class="bottom-nav__label bottom-nav__label--short" aria-hidden="true">{{
          item.shortLabel
        }}</span>
      }
    </button>
  }
</nav>
